name: Merge

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs dependency code on every PR and push, so the token is read-only.
permissions:
  contents: read

jobs:
  # Format, both lint passes, type-check and the unit and process tests: `pnpm check`.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      # setup-node already provides the devEngines.runtime pin, so pnpm skips downloading it again.
      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Check workspace
        run: pnpm check

  # The browser suite and the packed smoke test, which launch Chromium. A job of its own, so a
  # unit or type failure does not wait on them.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --no-runtime

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Browser suite and packed smoke test
        run: pnpm exec turbo run test:browser test:packed-consumer
